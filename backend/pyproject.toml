[project]
name = "patterna-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23,<26",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.0,<2.1",
    "tzdata>=2025.2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
