services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: patterna
      POSTGRES_USER: patterna
      POSTGRES_PASSWORD: ${PATTERNA_DB_PASSWORD:?Run python setup_local.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - patterna_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patterna -d patterna"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  patterna_data:
